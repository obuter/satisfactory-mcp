apiVersion: 1

# Prometheus for the FRM stack. Fixed uid so the provisioned dashboards can
# reference it directly. `prometheus` resolves to the frm-prometheus container
# on the compose network.
datasources:
  - name: Prometheus
    type: prometheus
    uid: PBFA97CFB590B2093
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
